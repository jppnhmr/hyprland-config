
windowrule = match:class kitty, opacity 0.9
windowrule = match:class thunar, opacity 0.98

windowrule = match:class *.exe, float on
windowrule = match:class steam_app_*, float on
windowrule = match:class steam_app_*, fullscreen off


windowrule = match:title startup-clock, float on
windowrule = match:title startup-clock, monitor 0
windowrule = match:title startup-clock, size 50% 50%
windowrule = match:title startup-clock, move 0 0

windowrule = match:title startup-upgrade, float on 
windowrule = match:title startup-upgrade, monitor 0 
windowrule = match:title startup-upgrade, size 50% 50%
windowrule = match:title startup-upgrade, move 50% 0

windowrule = match:title startup-fire, float on 
windowrule = match:title startup-fire, monitor 0 
windowrule = match:title startup-fire, size 100% 50%
windowrule = match:title startup-fire, move 0 50%

#Other Rules
env = QT_QPA_PLATFORMTHEME,hyprqt6engine 

