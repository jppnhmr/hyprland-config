# Turns the OLED off when you step away. Firefox video, Steam games and anything
# else that asks to keep the screen awake will hold this off.
#
# The hyprctl lines use Lua because the old `hyprctl dispatch dpms off` form
# doesn't work with a Lua config.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 100
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
